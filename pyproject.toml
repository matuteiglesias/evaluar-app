[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evaluar-app"
version = "0.0.0"
description = "Django educational tutoring platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.1,<5.3",
  "django-allauth[socialaccount]>=65.3,<66",
  "gunicorn>=21.2,<24",
  "psycopg[binary]>=3.2,<4",
  "bleach>=6.1,<7",
  "pyyaml>=6.0,<7",
  "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
legacy = [
  "Authlib>=1.3,<2",
  "firebase-admin>=6.4,<7",
  "Flask>=2.3,<4",
  "Flask-Session>=0.6,<1",
  "Flask-Limiter>=3.8,<5",
  "Flask-WTF>=1.2,<2",
  "Markdown>=3.4,<4",
  "openai>=1.0,<3",
  "oauthlib>=3.2,<4",
  "pandas>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

ai = [
  "agent-framework-core==1.13.0",
  "agent-framework-openai==1.12.0",
]

queue = [
  "google-auth>=2.40,<3",
  "google-cloud-tasks>=2.19,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-mock>=3.12,<4",
  "mypy>=1.14,<2",
  "pytest-django>=4.9,<5",
  "ruff>=0.12,<0.13",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evaluar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
django_find_project = false
DJANGO_SETTINGS_MODULE = "evaluar.config.settings.test"
markers = [
  "live: requires explicit staging provider credentials and performs billable network calls",
  "postgres: requires PostgreSQL and validates database-specific concurrency semantics",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations"]
