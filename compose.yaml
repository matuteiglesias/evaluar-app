services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evaluar
      POSTGRES_USER: evaluar
      POSTGRES_PASSWORD: evaluar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluar"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://evaluar:evaluar@db:5432/evaluar
      DJANGO_SECRET_KEY: local-compose-secret-change-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      GOOGLE_CLIENT_ID: local-placeholder
      GOOGLE_CLIENT_SECRET: local-placeholder
      TUTORING_ENABLED: ${TUTORING_ENABLED:-0}
      SUPPORT_ENABLED: ${SUPPORT_ENABLED:-0}
      SUPPORT_NOTIFICATIONS_ENABLED: ${SUPPORT_NOTIFICATIONS_ENABLED:-0}
    ports:
      - "8000:8000"
  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DATABASE_URL: postgresql://evaluar:evaluar@db:5432/evaluar
      DJANGO_SECRET_KEY: local-compose-secret-change-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      GOOGLE_CLIENT_ID: local-placeholder
      GOOGLE_CLIENT_SECRET: local-placeholder
  dispatcher:
    build: .
    profiles: ["tutoring"]
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "django", "dispatch_tutoring_outbox", "--watch", "--interval", "60"]
    environment:
      DATABASE_URL: postgresql://evaluar:evaluar@db:5432/evaluar
      DJANGO_SECRET_KEY: local-compose-secret-change-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      GOOGLE_CLIENT_ID: local-placeholder
      GOOGLE_CLIENT_SECRET: local-placeholder
      TUTORING_ENABLED: ${TUTORING_ENABLED:-0}
      TUTORING_TASK_QUEUE_PATH: ${TUTORING_TASK_QUEUE_PATH:-}
      TUTORING_WORKER_URL: ${TUTORING_WORKER_URL:-}
      TUTORING_TASK_AUDIENCE: ${TUTORING_TASK_AUDIENCE:-}
      TUTORING_TASK_SERVICE_ACCOUNT: ${TUTORING_TASK_SERVICE_ACCOUNT:-}
volumes:
  postgres-data:
