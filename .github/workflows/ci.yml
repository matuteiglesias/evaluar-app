name: Application CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify tested commit
        run: echo "Verifying $GITHUB_SHA" && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: astral-sh/setup-uv@v6

      - name: Install application
        run: uv sync --extra ai --extra queue --group dev

      - name: Build distribution
        run: uv build

      - name: Verify application
        run: make verify-sprint

      - name: Cleanup Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans || true
