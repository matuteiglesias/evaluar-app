name: Phase 2 CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install Phase 2 dependencies
        run: uv sync --group dev

      - name: Build distribution
        run: uv build

      - name: Verify canonical package
        run: |
          uv run python - <<'PY'
          import evaluar
          print(evaluar.__file__)
          assert evaluar.__file__
          assert "/src/evaluar/" in evaluar.__file__.replace("\\", "/")
          PY

      - name: Lint
        run: uv run ruff check src/evaluar tests/test_django_phase2.py tests/test_content_pipeline.py tests/test_content_inventory.py tests/test_packaging_layout.py manage.py

      - name: Format
        run: |
          uv run ruff format --check \
            src/evaluar \
            tests/test_content_pipeline.py \
            tests/test_content_inventory.py \
            tests/test_django_phase2.py \
            tests/test_packaging_layout.py \
            manage.py

      - name: Type check
        run: uv run mypy src/evaluar

      - name: Run Phase 2 tests
        run: |
          uv run pytest -q \
            tests/test_packaging_layout.py \
            tests/test_content_pipeline.py \
            tests/test_content_inventory.py \
            tests/test_django_phase2.py

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Verify migration state
        run: uv run python manage.py migrate --check

      - name: Validate content
        run: uv run python manage.py validate_content .

      - name: Build production image
        run: docker build -t evaluar:phase2 .

      - name: Container smoke test
        run: |
          set -eu
          docker network create evaluar-smoke
          docker run -d --name postgres --network evaluar-smoke \
            -e POSTGRES_DB=evaluar -e POSTGRES_USER=evaluar -e POSTGRES_PASSWORD=evaluar \
            postgres:16-alpine
          until docker exec postgres pg_isready -U evaluar; do sleep 1; done
          docker run -d --name evaluar --network evaluar-smoke -p 8000:8000 \
            -e DATABASE_URL=postgresql://evaluar:evaluar@postgres:5432/evaluar \
            -e DJANGO_SECRET_KEY=ci-secret-key-long-enough-for-phase-two \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e GOOGLE_CLIENT_ID=ci-placeholder \
            -e GOOGLE_CLIENT_SECRET=ci-placeholder \
            evaluar:phase2
          for attempt in $(seq 1 30); do
            if curl --fail -H "X-Forwarded-Proto: https" http://localhost:8000/health/live; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs evaluar; exit 1; fi
            sleep 1
          done
          curl --fail -H "X-Forwarded-Proto: https" http://localhost:8000/health/ready
