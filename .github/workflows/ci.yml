name: Application CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install application
        run: uv sync --extra ai --extra queue --group dev

      - name: Build distribution
        run: uv build

      - name: Verify application
        run: make verify-phase3

      - name: Build production image
        run: docker build -t evaluar:test .

      - name: Verify worker dependencies
        run: |
          docker run --rm \
            --entrypoint python \
            evaluar:test \
            -c "import agent_framework; import google.cloud.tasks_v2; import evaluar.tutoring; print('Worker dependencies available')"

      - name: Container smoke test
        run: |
          set -eu
          docker network create evaluar-smoke
          docker run -d --name postgres --network evaluar-smoke \
            -e POSTGRES_DB=evaluar -e POSTGRES_USER=evaluar -e POSTGRES_PASSWORD=evaluar \
            postgres:16-alpine
          until docker exec postgres pg_isready -U evaluar; do sleep 1; done
          docker run -d --name evaluar --network evaluar-smoke -p 8000:8000 \
            -e DATABASE_URL=postgresql://evaluar:evaluar@postgres:5432/evaluar \
            -e DJANGO_SECRET_KEY=ci-secret-key-long-enough-for-phase-two \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e GOOGLE_CLIENT_ID=ci-placeholder \
            -e GOOGLE_CLIENT_SECRET=ci-placeholder \
            evaluar:test
          for attempt in $(seq 1 30); do
            if curl --fail -H "X-Forwarded-Proto: https" http://localhost:8000/health/live; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs evaluar; exit 1; fi
            sleep 1
          done
          curl --fail -H "X-Forwarded-Proto: https" http://localhost:8000/health/ready
